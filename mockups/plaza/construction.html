<!doctype html><meta charset=utf-8>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="plate.css">
<!-- The a's outlines in every weight and the stem of each, written by render.mjs from the fonts. -->
<script src="outlines.js"></script>
<style>
  .split { flex: 1; display: grid; grid-template-columns: 1fr 318px; gap: 40px; align-items: center; padding-top: 10px; }
  .glyph { width: 100%; height: 548px; overflow: visible; }
  .glyph path.w { fill: none; stroke: var(--blue); stroke-width: 2.4; vector-effect: non-scaling-stroke; }
  .glyph path.regular { fill: color-mix(in srgb, var(--ink) 8%, transparent); stroke: var(--ink); stroke-width: 1.6; }
  .glyph .guide { stroke: var(--rule); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .glyph .dash { stroke-dasharray: 4 4; }
  .glyph .handle { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  .glyph .on { fill: var(--ground); stroke: var(--ink); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
  .glyph .off { fill: var(--ground); stroke: var(--muted); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .stems { display: flex; flex-direction: column; gap: 13px; }
  .stems p { margin: 0 0 8px; font: 400 16px/1.5 var(--plaza); color: var(--muted); }
  .st { display: grid; grid-template-columns: 96px 1fr 34px; align-items: center; gap: 12px; }
  .nm { font: 500 15px/1 var(--plaza); }
  .bar { height: 8px; border-radius: 2px; background: var(--rule); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); }
  .st .label { text-align: right; }
</style>
<body class="dark">
<div class="plate">
  <div class="head"><b>One drawing, nine weights</b><span>The a, Thin to Black · Regular with its points</span></div>
  <div class="body split">
    <svg class="glyph" id="glyph" viewBox="-400 -640 800 720">
      <line x1="-400" x2="400" y1="0" y2="0" class="guide"/><line x1="-400" x2="400" y1="-540" y2="-540" class="guide dash"/>
    </svg>
    <div class="stems" id="stems">
      <p>Each letter is written once, in Python, as a function of the stem. Nine stems give nine weights.</p>
    </div>
  </div>
</div>
<script>
  const { weights, handles, points } = window.PLAZA_A;
  const svg = document.getElementById('glyph');
  const max = Math.max(...weights.map((w) => w.stem));
  let marks = weights.map((w) => `<path d="${w.path}" class="w${w.name === 'Regular' ? ' regular' : ''}"/>`).join('');
  marks += `<path d="${handles}" class="handle"/>`;
  marks += points.map(([x, y, on]) => on
    ? `<rect x="${x - 7}" y="${y - 7}" width="14" height="14" class="on"/>`
    : `<circle cx="${x}" cy="${y}" r="6.5" class="off"/>`).join('');
  svg.insertAdjacentHTML('beforeend', marks);
  document.getElementById('stems').insertAdjacentHTML('beforeend',
    weights.map((w) => `<div class="st"><span class="nm">${w.name}</span><span class="bar"><i style="width:${(w.stem / max) * 100}%"></i></span><span class="label">${w.stem}</span></div>`).join('')
    + '<span class="label" style="margin-top:6px">Stem width in font units</span>');
</script>
