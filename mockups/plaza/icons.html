<!doctype html><meta charset=utf-8>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  .icon img { width: 290px; height: 290px; object-fit: contain; }

</style>
<body class="paper">
<div class="plate">

    <div class="icon"><img src="icon-explore.png" alt=""><b>Explore</b><span class="label">N, E, S and W</span></div>
    <div class="icon"><img src="icon-agenda.png" alt=""><b>Agenda</b><span class="label">1 to 31</span></div>
    <div class="icon"><img src="icon-faq.png" alt=""><b>FAQ</b><span class="label">The question mark</span></div>
  </div>
</div>
