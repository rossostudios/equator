<!doctype html><meta charset=utf-8>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=block">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="plate.css">
<style>
  .grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; gap: 14px; padding-top: 22px; }
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 18px 16px; display: flex; flex-direction: column; overflow: hidden; }
  .pair { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; font: 500 74px/1.12 var(--plaza); padding-bottom: .12em; }
  .arrow { font-size: .3em; color: var(--muted); align-self: center; }
  .cap { display: flex; flex-direction: column; gap: 5px; }
  .cap b { font: 500 16px/1.2 var(--plaza); }
</style>
<div class="plate">
  <div class="head"><b>Alternates</b><span>Eight stylistic sets · or all at once with "salt"</span></div>
  <div class="body grid"><div class="card"><div class="pair"><span>a</span><span class="arrow">→</span><span style="font-feature-settings:'ss01'">a</span></div><div class="cap"><b>Round single-storey a</b><span class="label">&quot;ss01&quot;</span></div></div><div class="card"><div class="pair"><span>e</span><span class="arrow">→</span><span style="font-feature-settings:'ss02'">e</span></div><div class="cap"><b>Round tilted e</b><span class="label">&quot;ss02&quot;</span></div></div><div class="card"><div class="pair"><span>g</span><span class="arrow">→</span><span style="font-feature-settings:'ss03'">g</span></div><div class="cap"><b>Swash g</b><span class="label">&quot;ss03&quot;</span></div></div><div class="card"><div class="pair"><span>G</span><span class="arrow">→</span><span style="font-feature-settings:'ss04'">G</span></div><div class="cap"><b>G without bar</b><span class="label">&quot;ss04&quot;</span></div></div><div class="card"><div class="pair"><span>J</span><span class="arrow">→</span><span style="font-feature-settings:'ss05'">J</span></div><div class="cap"><b>J with top bar</b><span class="label">&quot;ss05&quot;</span></div></div><div class="card"><div class="pair"><span>M</span><span class="arrow">→</span><span style="font-feature-settings:'ss06'">M</span></div><div class="cap"><b>Straight-sided M</b><span class="label">&quot;ss06&quot;</span></div></div><div class="card"><div class="pair"><span>Q</span><span class="arrow">→</span><span style="font-feature-settings:'ss07'">Q</span></div><div class="cap"><b>Swash Q</b><span class="label">&quot;ss07&quot;</span></div></div><div class="card"><div class="pair"><span>R</span><span class="arrow">→</span><span style="font-feature-settings:'ss08'">R</span></div><div class="cap"><b>Straight-leg R</b><span class="label">&quot;ss08&quot;</span></div></div></div>
</div>
